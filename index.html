<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para el amor de mi vida</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(120deg, #fbe7e0, #f7c6c7);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.card {
    background: #fff6f1;
    width: 95%;
    max-width: 950px;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,.2);
    display: flex;
    flex-wrap: wrap;
    padding: 25px;
    position: relative;
    overflow: hidden;
}

.text {
    flex: 1 1 300px;
    color: #6b4f4f;
    line-height: 1.6;
}

.text h3 {
    margin-top: 0;
    font-weight: normal;
}

.counter {
    margin-top: 25px;
    font-size: 18px;
    font-weight: bold;
}

.foto {
    width: 180px;
    border-radius: 15px;
    margin-top: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,.2);
}

.tree {
    flex: 1 1 300px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: flex-end;
}

.trunk {
    width: 18px;
    height: 140px;
    background: #3b7f6a;
    border-radius: 10px;
}

.heart {
    position: absolute;
    width: 280px;
    height: 260px;
    bottom: 120px;
}

.leaf {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    animation: pulse 3s infinite alternate;
}

@keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.3); }
}

.petal {
    position: fixed;
    width: 10px;
    height: 10px;
    background: hotpink;
    border-radius: 50%;
    opacity: .7;
    animation: fall linear infinite;
}

@keyframes fall {
    from { transform: translateY(-20px); }
    to { transform: translateY(110vh); }
}

.music {
    position: absolute;
    bottom: 15px;
    right: 20px;
}

.music button {
    background: #ff6f91;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 20px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="card">

    <div class="text">
        <h3>Para el amor de mi vida, <span id="Scarlett"></span>:</h3>

        <p id="mensaje">
Si pudiera elegir un lugar seguro, sería a tu lado.
Cuanto más tiempo estoy contigo, más te amo.
        </p>

        <img src="foto.jpg" class="foto">

        <div class="counter">
            Mi amor por ti comenzó hace…<br>
            <span id="time"></span>
        </div>
    </div>

    <div class="tree">
        <div class="heart" id="heart"></div>
        <div class="trunk"></div>
    </div>

    <div class="music">
        <button onclick="toggleMusic()">🎵 Música</button>
    </div>

</div>

<audio id="music" loop>
    <source src="https://cdn.pixabay.com/audio/2023/02/14/audio_5a7b6f71d8.mp3">
</audio>

<script>
// Nombre automático
const params = new URLSearchParams(window.location.search);
const nombre = params.get("Scarlett") || "Mi amor";
document.getElementById("Scarlett").innerText = nombre;

// Texto animado
const mensaje = document.getElementById("mensaje");
const texto = mensaje.innerText;
mensaje.innerText = "";
let i = 0;

function escribir() {
    if (i < texto.length) {
        mensaje.innerHTML += texto.charAt(i);
        i++;
        setTimeout(escribir, 40);
    }
}
escribir();

// Corazón
const heart = document.getElementById("heart");
const colors = ["#ff6f91", "#ff9671", "#ffc75f", "#f9f871"];

for (let i = 0; i < 600; i++) {
    const t = Math.random() * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);

    const leaf = document.createElement("div");
    leaf.className = "leaf";
    leaf.style.background = colors[Math.floor(Math.random() * colors.length)];
    leaf.style.left = 140 + x * 7 + "px";
    leaf.style.top = 120 - y * 7 + "px";
    heart.appendChild(leaf);
}

// Pétalos
for (let i = 0; i < 25; i++) {
    const petal = document.createElement("div");
    petal.className = "petal";
    petal.style.left = Math.random() * 100 + "vw";
    petal.style.animationDuration = (6 + Math.random() * 6) + "s";
    document.body.appendChild(petal);
}

// Contador
const startDate = new Date("2019-04-24T14:32:04");

function updateTime() {
    const now = new Date();
    let diff = Math.floor((now - startDate) / 1000);

    const days = Math.floor(diff / 86400);
    diff %= 86400;
    const hours = Math.floor(diff / 3600);
    diff %= 3600;
    const minutes = Math.floor(diff / 60);
    const seconds = diff % 60;

    document.getElementById("time").innerHTML =
        `${days} días ${hours} horas ${minutes} minutos ${seconds} segundos`;
}
setInterval(updateTime, 1000);
updateTime();

// Música
const music = document.getElementById("music");
function toggleMusic() {
    music.paused ? music.play() : music.pause();
}
</script>

</body>
</html>
